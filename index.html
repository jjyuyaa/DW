<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>덴우 서고</title>
<meta name="theme-color" content="#1B2130">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="덴우 서고">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@400;800&family=Gowun+Dodum&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --ink:#1B2130; --sub:#5E6576; --line:#D9DDE5;
  --accent:#8C3B55; --accent-soft:#F3E4E9; --on-accent:#FFFFFF; --star:#C98A1B; --danger:#B3261E;
  --ui:"IBM Plex Sans KR",system-ui,sans-serif; --read:"Gowun Batang","Nanum Myeongjo",serif;
}
@media (prefers-color-scheme: dark){:root{
  color-scheme:dark;--bg:#12151C;--surface:#1B1F29;--ink:#E7E9EF;--sub:#9AA1B2;--line:#2C3240;--accent:#E08AA3;--accent-soft:#3A2330;--on-accent:#1B1F29;--star:#E3B04B;--danger:#F2B8B5;}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 calc(80px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:22px;letter-spacing:-.02em;background:none;border:0;padding:0}
.logo small{font-family:var(--ui);font-weight:500;font-size:11px;color:var(--sub);letter-spacing:.12em;margin-left:6px}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:13px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.big{padding:12px;font-size:15px;width:100%}
.tabs{display:flex;gap:4px;margin-block:16px 12px;overflow-x:auto}
.tab{flex:none;border:0;background:none;padding:8px 10px;border-radius:999px;color:var(--sub);font-weight:500;white-space:nowrap}
.tab.on{background:var(--ink);color:var(--bg)}
.search{display:flex;gap:8px;margin-block:16px 0}
.search select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 10px}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px}
.cont{margin-top:16px;display:flex;gap:14px;align-items:center;background:var(--ink);color:var(--bg);border-radius:14px;padding:14px 16px;border:0;width:100%;text-align:left}
.cont .t{font-family:var(--read);font-size:17px;font-weight:700}
.cont .s{font-size:12px;opacity:.75}
.bar{height:4px;border-radius:2px;background:rgba(128,128,128,.35);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--sub);font-weight:600;margin-block:24px 8px}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:14px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.spine{height:70px;border-radius:3px 6px 6px 3px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-family:"Nanum Myeongjo",serif;font-weight:800;color:#fff;font-size:13px;box-shadow:inset 4px 0 0 rgba(0,0,0,.18)}
.item h3{margin:0;font-family:var(--read);font-size:17px;text-wrap:balance}
.meta{font-size:12.5px;color:var(--sub);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-size:11.5px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 8px}
.stars{color:var(--star);font-variant-numeric:tabular-nums}
.empty{color:var(--sub);padding:28px 0;text-align:center;line-height:1.7}
.hero{display:grid;grid-template-columns:96px 1fr;gap:18px;margin-top:20px}
.hero .spine{height:136px;font-size:16px}
.hero h1{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:26px;margin:0 0 6px;text-wrap:balance}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.rate{display:flex;gap:2px}
.rate button{border:0;background:none;font-size:28px;color:var(--line);padding:0 2px}
.rate button.on{color:var(--star)}
textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;resize:vertical}
.rev{border-top:1px solid var(--line);padding-block:12px}
.rev b{font-weight:600;color:var(--ink)}
/* auth */
.auth{max-width:380px;margin:48px auto 0;display:flex;flex-direction:column;gap:12px}
.auth h1{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:34px;margin:0}
.auth .lead{color:var(--sub);line-height:1.7;margin:0 0 8px}
input.f{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px}
.sheet input.f{background:var(--bg)}
.err{color:var(--danger);font-size:13px;margin:0}
.link{background:none;border:0;color:var(--accent);padding:4px;font-size:13px}
/* reader */
.reader{position:fixed;inset:0;z-index:20;background:var(--rbg);color:var(--rink);display:flex;flex-direction:column}
.rtop,.rbot{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--rline);background:var(--rbg)}
.rtop{padding-top:calc(10px + env(safe-area-inset-top,0px))}
.rbot{border-bottom:0;border-top:1px solid var(--rline);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--rsub)}
.rtop .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--rsub)}
.rtop button{background:none;border:1px solid var(--rline);color:var(--rink);border-radius:8px;padding:6px 10px;font-size:13px}
.rbody{flex:1;overflow-y:auto;padding-inline:20px;-webkit-overflow-scrolling:touch}
.rtext{max-width:640px;margin:0 auto;padding-block:32px 120px;word-break:keep-all;overflow-wrap:anywhere}
.rtext h2{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:1.3em;margin:0 0 1.6em;text-align:center}
.rtext p{margin:0 0 var(--pgap);position:relative;border-radius:4px;transition:background .15s}
.rtext p.bm::before{content:"";position:absolute;left:-12px;top:.3em;width:4px;height:1.1em;background:var(--accent);border-radius:2px}
.rtext p.hl{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.rtext p.sel{background:color-mix(in srgb,var(--rink) 8%,transparent)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);color:var(--ink);border-radius:18px 18px 0 0;border-top:1px solid var(--line);padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88%;overflow-y:auto;box-shadow:0 -10px 30px rgba(0,0,0,.18)}
.sheet .in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet h4{margin:0;font-size:16px}
.dim{position:fixed;inset:0;z-index:35;background:rgba(10,12,18,.4)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 11px;font-size:13px}
.seg button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.lab{font-size:12px;color:var(--sub);font-weight:600;letter-spacing:.06em;margin-bottom:6px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acts button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 6px;font-size:13px}
.quote{font-family:var(--read);font-size:15px;line-height:1.7;border-left:3px solid var(--accent);padding-left:12px;white-space:pre-wrap}
#cardOut{width:100%;max-width:360px;border-radius:10px;align-self:center;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;z-index:60;max-width:90vw;text-align:center}
.note{font-size:12px;color:var(--sub);line-height:1.6;margin:0}
.up-row{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center}
.up-row input{min-width:0;padding:8px;font-size:13px}
.up-row small{font-size:11px;color:var(--sub);white-space:nowrap}
/* 태그 · 정렬 · 카드 목록 */
.tagrow{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:2px;scrollbar-width:none}
.tagrow::-webkit-scrollbar{display:none}
.tg{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--sub);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.tg small{font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}
.tg.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tools{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.tools select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;font-size:13px}
.lay{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lay button{border:0;background:var(--surface);padding:5px 10px;font-size:14px;color:var(--sub)}
.lay button.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 14px}
@media (max-width:360px){.grid{grid-template-columns:1fr 1fr;gap:16px 10px}}
.bk{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.cover{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:4px 10px 10px 4px;padding:14px 12px 12px 16px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;overflow:hidden;box-shadow:inset 6px 0 0 rgba(0,0,0,.18),0 2px 8px rgba(20,24,36,.12)}
.cover .ct{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:17px;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.cover .ca{font-size:11.5px;opacity:.85}
.cover .cp{position:absolute;left:0;bottom:0;height:4px;background:rgba(255,255,255,.85)}
.bt{font-weight:600;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bg{font-size:11.5px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.row h3{margin:0;font-family:var(--read);font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{margin-top:2px}
.dot{flex:none;width:6px;height:34px;border-radius:3px}
.hero .chip{border:0}
/* 최근에 읽은 팬픽 */
.rhead{display:flex;align-items:center;justify-content:space-between;margin-top:20px}
.rstrip{display:flex;gap:12px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.rstrip::-webkit-scrollbar{display:none}
.rmini{flex:none;width:96px;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:5px}
.rmini .cover{padding:9px 8px 8px 11px}
.rmini .ct{font-size:12.5px;-webkit-line-clamp:4}
.rmini .ca{font-size:10.5px}
.rmini .bt{font-size:12px;font-weight:500}
.rrow{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.rrow>.btn{white-space:nowrap;flex:none}
/* 글 안에서 찾기 */
.findbar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--rline);background:var(--rbg)}
.findbar input{flex:1;min-width:0;border:1px solid var(--rline);background:transparent;color:var(--rink);border-radius:8px;padding:7px 10px;font-size:14px}
.findbar span{font-size:12px;color:var(--rsub);font-variant-numeric:tabular-nums;min-width:44px;text-align:center}
.findbar button{background:none;border:1px solid var(--rline);color:var(--rink);border-radius:8px;padding:6px 9px;font-size:13px}
.rtext mark{background:color-mix(in srgb,#F2C94C 45%,transparent);color:inherit;border-radius:2px}
.rtext mark.cur{background:#F2C94C;color:#1B1D22}
.loading{color:var(--sub);text-align:center;padding:48px 0}
@media (max-width:420px){.hero{grid-template-columns:72px 1fr}.hero .spine{height:104px}.up-row{grid-template-columns:1fr 1fr}.up-row small{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="topin">
  <button class="logo" id="goHome" type="button">덴우 서고<small>DANWOO</small></button>
  <span class="sp"></span>
  <button class="btn" id="acctBtn" type="button" hidden>내 정보</button>
</div></header>

<main class="wrap" id="app"><p class="loading">불러오는 중…</p></main>

<div id="dim" class="dim" hidden></div>
<div id="sheet" class="sheet" hidden><div class="in" id="sheetIn"></div></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ===== Supabase 연결 정보 (공개 키라 여기 있어도 괜찮아요) ===== */
const SUPABASE_URL = 'https://iiwwmerpqkgyreenuujp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_P1nX5X5QhhLmCeh_MCnoTQ_gi5p2WEr';
if(!window.supabase){document.getElementById('app').innerHTML='<p class="loading">연결 도구를 불러오지 못했어요. 새로고침해 주세요.</p>';throw new Error('supabase-js not loaded')}
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function lget(k,d){try{const v=localStorage.getItem('danwoo_'+k);return v?JSON.parse(v):d}catch(e){return d}}
function lset(k,v){try{localStorage.setItem('danwoo_'+k,JSON.stringify(v))}catch(e){}}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,2200)}
function ymd(d){d=new Date(d);return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`}
const COLORS=['#3E5C76','#7A3B52','#4F6B4A','#6B4F7A','#7A6440','#3F6670','#5B4A6E','#6E4A3F'];

const S = {
  user:null, profile:null, works:[], stats:{}, progress:{}, bookmarks:[], quotes:[], bodies:{},
  set: lget('set',{size:18,lh:1.9,font:'batang',theme:'paper',gap:1.1}),
  tab:'all', q:'', qBy:'title', view:'home', detailId:null
};
const isAdmin = () => !!S.profile?.is_admin;
const paras = body => body.split(/\r?\n+/).map(s=>s.trim()).filter(Boolean);
const workById = id => S.works.find(w=>w.id===id);

/* ===== 로그인 ===== */
function authView(mode='in', msg=''){
  $('#acctBtn').hidden = true;
  $('#app').innerHTML = `
  <form class="auth" id="authForm">
    <h1>덴우 서고</h1>
    <p class="lead">흩어진 덴우 텍파를 한곳에.<br>${mode==='in'?'로그인하고 읽던 곳부터 이어보세요.':'처음이면 가입부터 해주세요.'}</p>
    ${mode==='up'?'<input class="f" id="aNick" placeholder="닉네임 (리뷰에 보여요)" maxlength="16" autocomplete="nickname" required>':''}
    <input class="f" id="aEmail" type="email" placeholder="이메일" autocomplete="email" required>
    <input class="f" id="aPw" type="password" placeholder="비밀번호 (6자 이상)" minlength="6" autocomplete="${mode==='in'?'current-password':'new-password'}" required>
    ${msg?`<p class="err">${esc(msg)}</p>`:''}
    <button class="btn pri big" type="submit" id="aGo">${mode==='in'?'로그인':'가입하기'}</button>
    <button class="link" type="button" id="aSwap">${mode==='in'?'계정이 없어요 → 가입하기':'이미 계정이 있어요 → 로그인'}</button>
  </form>`;
  $('#aSwap').onclick = () => authView(mode==='in'?'up':'in');
  $('#authForm').onsubmit = async e => {
    e.preventDefault();
    const email=$('#aEmail').value.trim(), password=$('#aPw').value;
    $('#aGo').disabled = true;
    let res;
    if(mode==='up'){
      const nickname=$('#aNick').value.trim();
      res = await sb.auth.signUp({email,password,options:{data:{nickname}}});
    } else {
      res = await sb.auth.signInWithPassword({email,password});
    }
    if(res.error){
      const m=res.error.message||'';
      let k='문제가 생겼어요: '+m;
      if(/Invalid login/i.test(m)) k='이메일이나 비밀번호가 맞지 않아요.';
      else if(/already registered/i.test(m)) k='이미 가입된 이메일이에요. 로그인해 주세요.';
      else if(/at least 6/i.test(m)) k='비밀번호는 6자 이상이어야 해요.';
      else if(/rate limit/i.test(m)) k='잠시 후 다시 시도해 주세요.';
      authView(mode,k); return;
    }
    if(mode==='up' && !res.data.session){ authView('in','가입됐어요! 로그인해 주세요.'); }
  };
}

/* ===== 데이터 불러오기 ===== */
async function loadAll(){
  const uid=S.user.id;
  const [p,w,st,pr,bm,qt] = await Promise.all([
    sb.from('profiles').select('*').eq('id',uid).maybeSingle(),
    sb.from('works').select('id,title,author,tags,color,written_at,created_at').order('created_at',{ascending:false}),
    sb.from('work_stats').select('*'),
    sb.from('progress').select('work_id,ratio,updated_at'),
    sb.from('bookmarks').select('id,work_id,para,snippet,created_at').order('created_at',{ascending:false}),
    sb.from('quotes').select('id,work_id,para,content,created_at').order('created_at',{ascending:false}),
  ]);
  const e=[p,w,st,pr,bm,qt].find(r=>r.error);
  if(e){ $('#app').innerHTML=`<p class="empty">데이터를 불러오지 못했어요.<br>${esc(e.error.message)}</p>`; return false; }
  S.profile=p.data; S.works=w.data||[];
  S.stats={}; (st.data||[]).forEach(r=>S.stats[r.work_id]=r);
  S.progress={}; (pr.data||[]).forEach(r=>S.progress[r.work_id]={r:r.ratio,t:new Date(r.updated_at).getTime()});
  S.bookmarks=bm.data||[]; S.quotes=qt.data||[];
  return true;
}
async function refreshStats(){const {data}=await sb.from('work_stats').select('*');S.stats={};(data||[]).forEach(r=>S.stats[r.work_id]=r)}

/* ===== 홈 ===== */
S.layout=lget('layout','grid'); S.sort=lget('sort','new'); S.tag=null; S.bodyHits=null;
let bodyT=null;
function allTags(){const m={};S.works.forEach(w=>(w.tags||[]).forEach(t=>m[t]=(m[t]||0)+1));return Object.entries(m).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ko'))}
function filtered(){
  let list=S.works.slice();
  if(S.tag) list=list.filter(x=>(x.tags||[]).includes(S.tag));
  const q=S.q.trim().toLowerCase();
  if(q){
    if(S.qBy==='body') list=(S.bodyHits&&S.bodyHits.q===q)?list.filter(x=>S.bodyHits.ids.has(x.id)):[];
    else list=list.filter(x=>(S.qBy==='title'?x.title:x.author).toLowerCase().includes(q));
  }

  return list;

const THEMES={paper:{bg:'#F7F6F2',ink:'#23252B',sub:'#80838C',line:'#E3E1DA',n:'종이'},white:{bg:'#FFFFFF',ink:'#1B1D22',sub:'#8A8D95',line:'#EAEAEA',n:'흰색'},sepia:{bg:'#EADFCB',ink:'#3D3226',sub:'#7F6E58',line:'#D6C8AE',n:'세피아'},green:{bg:'#DDE8DA',ink:'#26322A',sub:'#667566',line:'#C6D4C2',n:'연두'},night:{bg:'#15171C',ink:'#C9CCD3',sub:'#6E7380',line:'#262A33',n:'야간'}};
const FONTS={batang:['고운바탕','"Gowun Batang",serif'],myeongjo:['나눔명조','"Nanum Myeongjo",serif'],dodum:['고운돋움','"Gowun Dodum",sans-serif'],sans:['고딕','"IBM Plex Sans KR",sans-serif']};

/* ===== 글 안에서 찾기 ===== */
let marks=[], mIdx=0;
function openFind(q){const fb=$('#findbar');fb.hidden=false;const i=$('#fq');if(q!=null)i.value=q;i.focus();if(i.value)runFind(i.value)}
function runFind(q){
  q=q.trim(); const ql=q.toLowerCase();
  document.querySelectorAll('#rtext p[data-i]').forEach(p=>{
    const t=curParas[+p.dataset.i];
    if(!ql){p.textContent=t;return}
    const tl=t.toLowerCase(); let out='',from=0,k;
    while((k=tl.indexOf(ql,from))!==-1){out+=esc(t.slice(from,k))+'<mark>'+esc(t.slice(k,k+q.length))+'</mark>';from=k+q.length}
    p.innerHTML=out+esc(t.slice(from));
  });
  marks=[...document.querySelectorAll('#rtext mark')]; mIdx=0;
  if(!ql){$('#fcnt').textContent='';return}
  if(!marks.length){$('#fcnt').textContent='0개';return}
  // 지금 보고 있는 위치 다음 결과부터
  const b=$('#rbody'),top=b.getBoundingClientRect().top;
  const k=marks.findIndex(m=>m.getBoundingClientRect().top>top+10); mIdx=k<0?0:k;
  showMark();
}
function stepFind(d){if(!marks.length)return;mIdx=(mIdx+d+marks.length)%marks.length;showMark()}
function showMark(){
  marks.forEach(m=>m.classList.remove('cur'));const m=marks[mIdx];m.classList.add('cur');
  const b=$('#rbody');b.scrollTop+=m.getBoundingClientRect().top-b.getBoundingClientRect().top-b.clientHeight/3;
  $('#fcnt').textContent=`${mIdx+1}/${marks.length}`;
}
async function saveProgress(id,ratio){

}

function applySet(){const r=$('#reader');if(!r)return;const t=THEMES[S.set.theme]||THEMES.paper,s=S.set;
  r.style.cssText=`--rbg:${t.bg};--rink:${t.ink};--rsub:${t.sub};--rline:${t.line};--pgap:${s.gap}em`;

/* ===== 대사 카드 ===== */
const CARDBG=[['밤하늘',['#1D2440','#3B2E55'],'#F1ECF7'],['벚꽃',['#F6D9E0','#EDC4D0'],'#4A2231'],['종이',['#F4F1E8','#E8E2D2'],'#2E2A22'],['바다',['#264653','#2A6F77'],'#EAF4F2'],['모노',['#111111','#2A2A2A'],'#F5F5F5']];
let cardBg=lget('cardBg',0);
function cardSheet(text,w){
  openSheet(`<h4>대사 카드</h4>
  <div class="seg" id="bgSeg">${CARDBG.map((c,i)=>`<button type="button" data-b="${i}" class="${i===cardBg?'on':''}">${c[0]}</button>`).join('')}</div>
  <img id="cardOut" alt="대사 카드">
  <button class="btn pri" type="button" id="cardSave">이미지 저장</button>
  <p class="note" style="text-align:center">저장이 안 되면 이미지를 길게 눌러(PC는 우클릭) 저장하세요.</p>
  <button class="btn" type="button" data-close-sheet>닫기</button>`);
  const draw=async()=>{await document.fonts.ready;$('#cardOut').src=makeCard(text,w,CARDBG[cardBg])};draw();
  $('#bgSeg').onclick=e=>{const b=e.target.closest('[data-b]');if(!b)return;cardBg=+b.dataset.b;lset('cardBg',cardBg);[...$('#bgSeg').children].forEach((c,i)=>c.classList.toggle('on',i===cardBg));draw()};
  $('#cardSave').onclick=async()=>{
    const url=$('#cardOut').src; const blob=await (await fetch(url)).blob();
    const file=new File([blob],`덴우서고_${(w?.title||'card').slice(0,20)}.png`,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e.name==='AbortError')return}}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  };
}
function makeCard(text,w,[,g,fg]){
  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const gr=x.createLinearGradient(0,0,W,H);gr.addColorStop(0,g[0]);gr.addColorStop(1,g[1]);x.fillStyle=gr;x.fillRect(0,0,W,H);
  x.fillStyle=fg;x.globalAlpha=.25;x.font='800 220px "Nanum Myeongjo",serif';x.fillText('“',90,300);x.globalAlpha=1;
  let fs=52; const maxW=W-220; let lines;
  const wrap=()=>{x.font=`400 ${fs}px "Gowun Batang",serif`;lines=[];text.split('\n').forEach(par=>{let line='';for(const ch of par){if(x.measureText(line+ch).width>maxW){lines.push(line);line=ch}else line+=ch}lines.push(line)})};
  wrap(); while(lines.length*fs*1.75>H-560&&fs>30){fs-=4;wrap()}
  const lh=fs*1.75; let y=(H-lines.length*lh)/2+fs;
  lines.slice(0,16).forEach(l=>{x.fillText(l,110,y);y+=lh});
  x.globalAlpha=.85;x.font='700 34px "Gowun Batang",serif';x.fillText(w?w.title:'',110,H-170);
  x.font='400 28px "IBM Plex Sans KR",sans-serif';x.fillText(w?w.author:'',110,H-120);
  x.textAlign='right';x.globalAlpha=.55;x.fillText('덴우 서고',W-110,H-120);
  return c.toDataURL('image/png');
}

/* ===== 업로드 (관리자) ===== */
function decodeText(buf){
  try{return new TextDecoder('utf-8',{fatal:true}).decode(buf).replace(/^﻿/,'')}
  catch(e){return new TextDecoder('euc-kr').decode(buf)}   // 옛날 한글 txt 파일 대응
}
let pending=[];
function uploadSheet(){
  pending=[];
  openSheet(`<h4>텍파 업로드</h4>
  <p class="note">.txt 파일을 여러 개 한꺼번에 고를 수 있어요. 파일 이름이 제목으로 들어가고, 파일 이름이 <b>제목_작가.txt</b> 모양이면 작가도 자동으로 채워져요.</p>
  <input class="f" type="file" id="uF" accept=".txt,text/plain" multiple>
  <div><div class="lab">공통 작가 (비어 있는 칸에만 들어가요)</div><input class="f" id="uA" placeholder="예: 작가 이름"></div>
  <div><div class="lab">공통 태그 (쉼표로 구분)</div><input class="f" id="uG" placeholder="예: 현대AU, 단편"></div>
  <div id="uList" style="display:flex;flex-direction:column;gap:8px"></div>
  <details><summary class="note" style="cursor:pointer">파일 대신 직접 붙여넣기</summary>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px"><input class="f" id="pT" placeholder="제목"><input class="f" id="pA" placeholder="작가"><textarea id="pX" rows="6" placeholder="본문"></textarea><button class="btn" type="button" id="pAdd">목록에 추가</button></div>
  </details>
  <button class="btn pri big" type="button" id="uGo" disabled>서고에 올리기</button>`);
  const renderList=()=>{
    $('#uList').innerHTML=pending.map((p,i)=>`<div class="up-row"><input class="f" data-ut="${i}" value="${esc(p.title)}" aria-label="제목"><input class="f" data-ua="${i}" value="${esc(p.author)}" placeholder="작가" aria-label="작가"><small>${p.body.length.toLocaleString()}자 <button class="link" type="button" data-urm="${i}">빼기</button></small></div>`).join('');
    $('#uGo').disabled=!pending.length; $('#uGo').textContent=pending.length?`${pending.length}편 서고에 올리기`:'서고에 올리기';
  };
  $('#uList').oninput=e=>{const t=e.target;if(t.dataset.ut)pending[+t.dataset.ut].title=t.value;if(t.dataset.ua)pending[+t.dataset.ua].author=t.value};
  $('#uList').onclick=e=>{const b=e.target.closest('[data-urm]');if(b){pending.splice(+b.dataset.urm,1);renderList()}};
  $('#uF').onchange=async e=>{
    for(const f of e.target.files){
      const body=decodeText(await f.arrayBuffer()).trim(); if(!body) continue;
      const base=f.name.replace(/\.txt$/i,''); const m=base.split(/\s*[_＿]\s*/);
      pending.push({title:m[0]||base,author:m.length>1?m.slice(1).join(' '):'',body});
    }
    e.target.value=''; renderList();
  };
  $('#pAdd').onclick=()=>{const t=$('#pT').value.trim(),x=$('#pX').value.trim();if(!t||!x){toast('제목과 본문이 필요해요');return}
    pending.push({title:t,author:$('#pA').value.trim(),body:x});$('#pT').value='';$('#pA').value='';$('#pX').value='';renderList()};
  $('#uGo').onclick=async()=>{
    const ca=$('#uA').value.trim(), tags=$('#uG').value.split(',').map(s=>s.trim()).filter(Boolean);
    const rows=pending.map((p,i)=>({title:p.title.trim()||'제목 없음',author:p.author.trim()||ca||'작가 미상',tags,color:COLORS[(S.works.length+i)%COLORS.length],written_at:ymd(Date.now()),body:p.body}));
    const btn=$('#uGo');btn.disabled=true;let done=0;
    for(let i=0;i<rows.length;i+=5){
      btn.textContent=`올리는 중… ${done}/${rows.length}`;
      const {error}=await sb.from('works').insert(rows.slice(i,i+5));
      if(error){toast('일부 실패: '+error.message);break}
      done+=Math.min(5,rows.length-i);
    }
    await loadAll(); closeSheet(); S.tab='all'; home(); toast(`${done}편을 올렸어요`);
  };
}
function editSheet(id){
  const x=workById(id);
  openSheet(`<h4>작품 수정</h4>
  <div><div class="lab">제목</div><input class="f" id="eT" value="${esc(x.title)}"></div>
  <div><div class="lab">작가</div><input class="f" id="eA" value="${esc(x.author)}"></div>
  <div><div class="lab">태그 (쉼표로 구분)</div><input class="f" id="eG" value="${esc((x.tags||[]).join(', '))}"></div>
  <div><div class="lab">날짜 표시</div><input class="f" id="eD" value="${esc(x.written_at||'')}" placeholder="예: 2024.08.14"></div>
  <div><div class="lab">표지 색</div><div class="seg" id="eC">${COLORS.map(c=>`<button type="button" data-c="${c}" class="${x.color===c?'on':''}" aria-label="${c}"><span style="display:inline-block;width:16px;height:16px;border-radius:4px;background:${c};vertical-align:middle"></span></button>`).join('')}</div></div>
  <div class="card" style="display:flex;flex-direction:column;gap:10px;padding:14px">
    <div class="lab" style="margin:0">본문 업데이트 (선택)</div>
    <div class="seg" id="eMode"><button type="button" data-m="append" class="on">뒤에 이어 붙이기</button><button type="button" data-m="replace">통째로 바꾸기</button></div>
    <input class="f" type="file" id="eF" accept=".txt,text/plain">
    <textarea id="eX" rows="5" placeholder="또는 추가할 내용을 여기에 붙여넣기"></textarea>
    <p class="note" id="eNote">연재 다음 편처럼 기존 글 뒤에 이어져요. 비워두면 본문은 그대로예요.</p>
  </div>
  <button class="btn pri big" type="button" id="eSave">저장</button>
  <div id="delBox"><button class="btn ghost danger" type="button" id="eDel">이 작품 삭제</button></div>`);
  let color=x.color;
  $('#eC').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;color=b.dataset.c;[...$('#eC').children].forEach(c=>c.classList.toggle('on',c===b))};
  let mode='append';
  $('#eMode').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;mode=b.dataset.m;[...$('#eMode').children].forEach(c=>c.classList.toggle('on',c===b));
    $('#eNote').textContent=mode==='append'?'연재 다음 편처럼 기존 글 뒤에 이어져요. 비워두면 본문은 그대로예요.':'수정본으로 전체를 바꿔요. 문단 순서가 바뀌면 독자들의 북마크 위치가 조금 어긋날 수 있어요.'};
  $('#eF').onchange=async e=>{const f=e.target.files[0];if(f)$('#eX').value=decodeText(await f.arrayBuffer()).trim()};
  $('#eSave').onclick=async()=>{
    const btn=$('#eSave');btn.disabled=true;
    const upd={title:$('#eT').value.trim()||x.title,author:$('#eA').value.trim()||'작가 미상',tags:$('#eG').value.split(',').map(s=>s.trim()).filter(Boolean),written_at:$('#eD').value.trim()||null,color};
    const add=$('#eX').value.trim();
    if(add){
      if(mode==='append'){
        let old=S.bodies[id];
        if(old==null){const r=await sb.from('works').select('body').eq('id',id).single();if(r.error){toast('본문을 불러오지 못했어요');btn.disabled=false;return}old=r.data.body}
        upd.body=old.replace(/\s+$/,'')+'\n\n'+add;
      } else upd.body=add;
    }
    const {error}=await sb.from('works').update(upd).eq('id',id);
    if(error){toast('저장하지 못했어요');btn.disabled=false;return}
    delete upd.body; delete S.bodies[id];
    Object.assign(x,upd);closeSheet();detail(id);toast(add?(mode==='append'?'새 내용을 이어 붙였어요':'본문을 바꿨어요'):'저장했어요')};
  $('#eDel').onclick=()=>{$('#delBox').innerHTML=`<p class="note">삭제하면 이 작품의 리뷰·북마크·저장 문장도 모두 지워져요.</p><div class="row"><button class="btn" type="button" data-close-sheet>취소</button><button class="btn pri" type="button" id="eDel2" style="background:var(--danger);border-color:var(--danger)">정말 삭제</button></div>`;
    $('#eDel2').onclick=async()=>{const {error}=await sb.from('works').delete().eq('id',id);if(error){toast('삭제하지 못했어요');return}
      await loadAll();closeSheet();home();toast('삭제했어요')}};
}

/* ===== 클릭 처리 ===== */
document.addEventListener('click',async e=>{
  const t=e.target.closest('button'); if(!t) return; const d=t.dataset;
  if(t.id==='goHome'){ if(S.user){S.tab='all';S.q='';S.tag=null;home()} }
  else if(t.id==='acctBtn') acctSheet();
  else if(d.home!=null){S.tab='all';home()}
  else if(d.tab){S.tab=d.tab;home()}
  else if(d.upload!=null) uploadSheet();
  else if(d.detail) detail(d.detail);
  else if(d.open) openReader(d.open,d.p!=null?+d.p:null,(S.view==='home'||S.view==='detail')&&S.qBy==='body'&&S.q.trim().length>=2?S.q.trim():null);
  else if(d.tagf!=null){S.tag=d.tagf||null;S.tab='all';S.view!=='home'?(window.scrollTo(0,0),home()):home()}
  else if(d.lay){S.layout=d.lay;lset('layout',S.layout);home()}
  else if(d.find!=null) openFind();
  else if(d.author){S.q=d.author;S.qBy='author';S.tag=null;S.tab='all';home()}
  else if(d.edit) editSheet(d.edit);
  else if(d.close!=null){closeReader();S.view==='detail'?detail(S.detailId):home()}
  else if(d.viewer!=null) viewerSheet();
  else if(d.closeSheet!=null) closeSheet();
  else if(d.mkcard){const q=S.quotes.find(x=>x.id===d.mkcard);if(q)cardSheet(q.content,workById(q.work_id))}
  else if(d.delpr){await sb.from('progress').delete().eq('work_id',d.delpr).eq('user_id',S.user.id);delete S.progress[d.delpr];home();toast('읽은 기록을 지웠어요')}
  else if(d.delq){await sb.from('quotes').delete().eq('id',d.delq);S.quotes=S.quotes.filter(x=>x.id!==d.delq);home()}
  else if(d.delrev){await sb.from('reviews').delete().eq('id',d.delrev);await refreshStats();detail(S.detailId)}
});
$('#dim').onclick=closeSheet;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&cur)saveProgress(cur.id,lastRatio)});

/* ===== 시작 ===== */
let booted;   // 처음엔 '아직 모름' 상태
sb.auth.onAuthStateChange((ev,session)=>{
  const uid=session?.user?.id||null;
  if(uid===booted) return; booted=uid;
  setTimeout(async()=>{
    if(!session){S.user=null;closeReader();authView();return}
    S.user=session.user; $('#app').innerHTML='<p class="loading">서고를 여는 중…</p>';
    if(await loadAll()) home();
  },0);
});
